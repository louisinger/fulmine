name: Build covclaim image

# Fork-only: builds a multiarch image and pushes it to ghcr.io/<owner>/fulmine:covclaim
# on every push to this branch. Guarded so it never runs on the upstream repo.
on:
  push:
    branches: [covclaim-ci]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build-and-push:
    if: github.repository_owner == 'louisinger'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set build date
      id: build_date
      run: echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/fulmine:covclaim
        platforms: linux/amd64,linux/arm64
        build-args: |
          VERSION=covclaim
          COMMIT=${{ github.sha }}
          DATE=${{ steps.build_date.outputs.date }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
